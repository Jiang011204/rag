services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-please-change-me}"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  api:
    build: .
    env_file:
      - .env
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      DATA_DIR: "/data"
      LOCAL_EMBEDDING_PATH: "/models/bge-small-zh-v1.5"
    ports:
      - "8000:8000"
    volumes:
      - kb_data:/data
      - ./models:/models
    depends_on:
      - neo4j
    restart: unless-stopped

  web:
    build: .
    env_file:
      - .env
    environment:
      KB_API_URL: "http://api:8000"
    command: ["streamlit", "run", "web/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    ports:
      - "8501:8501"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  neo4j_data:
  kb_data:
